services:
  - type: web
    name: tuitio-backend
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tuitio-db
          property: connectionString
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: REGISTRY_CONTRACT
        value: CCTZVSPMIYEA4X2Z6UP5IPIO2HBIZWHLV37OUDBV32YUCP64JNIPBCPO
      - key: ESCROW_CONTRACT
        value: CDPGTHO2O7LTURTJF7L7ZZZTZCXPNABAPGVRDMBYIJ737R6O3DOPWJ34
      - key: START_LEDGER
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: POLL_SECONDS
        value: "10"
      - key: PORT
        value: "8080"

databases:
  - name: tuitio-db
    plan: free
    databaseName: tuitio
    user: tuitio
